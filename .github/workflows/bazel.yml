name: Bazel Build & Test

on:
  push:
    branches: [ bazel ]
  pull_request:
    branches: [ bazel ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: release_clr+debug_libs
            flags: '--config=clr_release'
          - name: checked_clr+debug_libs
            flags: '--config=clr_checked'

    name: Bazel ${{ matrix.config.name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y clang-18 lld libkrb5-dev

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-${{ matrix.config.name }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ matrix.config.name }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc') }}-
            bazel-${{ matrix.config.name }}-

      - name: Build
        run: bazel build //... ${{ matrix.config.flags }} --disk_cache=~/.cache/bazel-disk

      - name: Test
        run: bazel test //... ${{ matrix.config.flags }} --disk_cache=~/.cache/bazel-disk --test_output=errors
