\* TLC Configuration for ThreadPoolWorkQueue.tla - Closed System Mode
\*
\* This configuration verifies that when enqueuers stop adding new work,
\* all queued work eventually gets processed (queue drains completely).
\*
\* Use this to verify AllWorkEventuallyProcessed property, which requires:
\*   - SF_vars(StopEnqueueing) - strong fairness ensures enqueueing eventually stops
\*   - Workers eventually process all remaining work
\*
\* Note: Uses more states than open system (1288 vs 795 in default config)
\* because StopEnqueueing can fire at any point, doubling the state space.

CONSTANTS
    MaxQueueSize = 2
    NumEnqueuers = 2
    NumWorkers = 2

\* CLOSED SYSTEM - Enqueuers eventually stop (for queue drain verification)
\* Uses ClosedSpec which adds SF_vars(StopEnqueueing) to Fairness.
SPECIFICATION ClosedSpec

\* Type safety
INVARIANT TypeOK

\* Core safety property - work must never be stranded
INVARIANT NoStrandedWork

\* Liveness: All enqueued work eventually gets processed
\* This ONLY passes with ClosedSpec (enqueuers eventually stop)
PROPERTY AllWorkEventuallyProcessed

\* Allow termination when system quiesces (queue empty, no workers active)
CHECK_DEADLOCK FALSE
