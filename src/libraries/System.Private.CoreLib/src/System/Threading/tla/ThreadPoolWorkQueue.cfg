\* TLC Configuration for ThreadPoolWorkQueue.tla
\*
\* Run with: tlc ThreadPoolWorkQueue.tla -config ThreadPoolWorkQueue.cfg
\*
\* For VS Code: Install TLA+ extension, open .tla file, press Ctrl+Shift+P
\* and run "TLA+: Check model with TLC"
\*
\* This model includes:
\*   - Work stealing with missedSteal handling
\*   - Worker loop (multiple items per dispatch)
\*   - Memory barrier documentation
\*   - Closed system mode for queue drain verification (see ClosedSpec.cfg)

CONSTANTS
    MaxQueueSize = 2
    NumEnqueuers = 2
    NumWorkers = 2

\* ---------------------------------------------------------------------------
\* SAFETY ONLY (slightly faster, ~600ms vs ~1300ms)
\* Use INIT/NEXT if you only want to check invariants without liveness.
\* NOTE: Do NOT use PROPERTY with INIT/NEXT - liveness requires fairness!
\* ---------------------------------------------------------------------------
\* INIT Init
\* NEXT Next

\* ---------------------------------------------------------------------------
\* OPEN SYSTEM - Enqueuers may run forever (default)
\* Uses Spec which includes Init, Next, and Fairness.
\* WorkerEventuallyStarts passes; AllWorkEventuallyProcessed fails (expected).
\* ---------------------------------------------------------------------------
SPECIFICATION Spec

\* ---------------------------------------------------------------------------
\* CLOSED SYSTEM - Enqueuers eventually stop (for queue drain verification)
\* See ThreadPoolWorkQueue.ClosedSpec.cfg for this configuration.
\* Uses ClosedSpec which adds SF_vars(StopEnqueueing) to Fairness.
\* Both WorkerEventuallyStarts AND AllWorkEventuallyProcessed pass.
\* ---------------------------------------------------------------------------
\* SPECIFICATION ClosedSpec

\* Type safety
INVARIANT TypeOK

\* Core safety property - work must never be stranded
INVARIANT NoStrandedWork

\* ---------------------------------------------------------------------------
\* LIVENESS PROPERTIES (require SPECIFICATION, not INIT/NEXT)
\* ---------------------------------------------------------------------------
\* WorkerEventuallyStarts: If a worker is requested, eventually one starts.
\* PASSES with both Spec and ClosedSpec.
PROPERTY WorkerEventuallyStarts

\* AllWorkEventuallyProcessed: Eventually the queue becomes empty.
\* FAILS with Spec (enqueuers can run forever).
\* PASSES with ClosedSpec (enqueuers eventually stop).
\* PROPERTY AllWorkEventuallyProcessed